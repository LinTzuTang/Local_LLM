# Deep blue, low saturation on purpose (easy on the eyes for long sessions). Day and night
# themes: each viewer picks one with the switch at the top right (theme_switch.py), and until
# then the system setting decides. app/ui.py PALETTES has the same colours for our own HTML.
#
# Fonts are bundled (app/static/fonts, SIL OFL) so the app looks the same offline and on every
# machine: Inter for Latin text and headings, JetBrains Mono for numbers and labels; Chinese
# falls through to the system's PingFang / Noto Sans CJK.
[server]
enableStaticServing = true

[theme]
font = "Inter, -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif"
headingFont = "Inter, -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif"
codeFont = "'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace"
baseRadius = "medium"
headingFontWeights = [760, 720, 680, 650, 620, 600]
showSidebarBorder = true

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/InterVariable.woff2"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/InterVariable-Italic.woff2"
weight = "100 900"
style = "italic"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/fonts/JetBrainsMono-Regular.woff2"
weight = "400"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/fonts/JetBrainsMono-SemiBold.woff2"
weight = "600"

[theme.light]
primaryColor = "#2D5A9C"
backgroundColor = "#F4F5F8"
secondaryBackgroundColor = "#E9ECF2"
textColor = "#1F2430"
linkColor = "#2D5A9C"
borderColor = "#DADEE6"
dataframeBorderColor = "#E1E4EB"
dataframeHeaderBackgroundColor = "#EEF0F5"
codeBackgroundColor = "#E9ECF2"

[theme.dark]
primaryColor = "#4F78B8"
backgroundColor = "#12161D"
secondaryBackgroundColor = "#1C2330"
textColor = "#D9DFEA"
linkColor = "#9DBBE8"
borderColor = "#2A3343"
dataframeBorderColor = "#2A3343"
dataframeHeaderBackgroundColor = "#1C2330"
codeBackgroundColor = "#1C2330"

[client]
toolbarMode = "minimal"
