[project]
name = "local-llm-agent"
version = "0.1.0"
description = "Local Agent Lab: benchmark local LLMs and demo multi-agent scenarios on a Mac (Ollama, LangGraph, Streamlit)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=1,<2",
    "langchain-ollama>=1,<2",
    "langchain-openai>=1,<2",
    "python-dotenv>=1,<2",
    "httpx>=0.28,<1",
    "rich>=14,<16",
    "streamlit>=1.65.0",
    "pandas>=3.0.6",
    "trafilatura>=2.3.1",
    "psycopg[binary]>=3.3.6",
    "faker>=40.43.0",
    "openpyxl>=3.1.5",
    "fastapi>=0.143.0",
    "python-multipart>=0.0.32",
    "huggingface-hub>=1.33.0",
    "mlx-whisper>=0.4.3",
    "sentence-transformers>=6.1.0",
    "docling>=2.138.0",
    "ocrmac>=1.0.1",
    "mcp>=1.29,<2",
    "mcp-server-time>=2026.10.10",
    "mcp-server-git>=2026.10.10",
    "mcp-server-fetch>=2026.10.10",
    "pyyaml>=6",
    "psutil>=7.2.2",
    "mlx-audio[stt]>=0.5.9",
    "opencc>=1.4.2",
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
    "sacrebleu>=2.6.0",
    "misaki[zh]>=0.9.4",
]

[project.scripts]
local-agent = "local_llm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_llm"]

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=8",
    "ruff>=0.12",
]
eval = [
    "jiwer>=4.0.0",
    "matplotlib>=3.11.2",
    "sacrebleu>=2.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# UI pages hold long Traditional Chinese copy and markdown tables.
"app/views/*" = ["E501"]
"app/voice_panel.py" = ["E501"]  # the live voice assistant's page body, shared with the gallery
# Schema DDL and Chinese sample-data templates.
"src/local_llm/company_db.py" = ["E501"]
# Bilingual descriptions of the MCP servers and tools.
"src/local_llm/mcp_tools.py" = ["E501"]
